[package]
name = "snartnet-cli"
version = "0.3.3"
edition = "2021"
description = "SnartNet command-line interface"
license = "AGPL-3.0-only"

[[bin]]
name = "snartnet"
path = "src/main.rs"

[dependencies]
snartnet-sdk = { path = "../sdk" }
snartnet-daemon = { path = "../daemon" }
clap = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
