[package]
name = "snartnet-android-bridge"
version = "0.3.9"
edition = "2021"
license = "AGPL-3.0-only"

# A cdylib for the app, an rlib so the crate can be tested like any other.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
snartnet-client = { path = "../client" }
snartnet-core = { path = "../core" }
snartnet-daemon = { path = "../daemon" }
snartnet-sdk = { path = "../sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
jni = "0.21"
base64 = { workspace = true }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
